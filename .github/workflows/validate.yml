name: Validate dataset

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate index JSON files
        run: |
          python -m json.tool models/index.json > /dev/null
          python -m json.tool models/microphones/index.json > /dev/null
          python -m json.tool models/preamps/index.json > /dev/null

      - name: Run repository validation
        run: python tools/validate_repo.py

      - name: Build dist and ensure it is up to date
        run: |
          python tools/build_dist.py
          git diff --exit-code dist/models_flat.ndjson
